name: Container image
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize main and demo releases without cancelling an active deployment.
# Current-branch checks reject stale reruns; GitHub does not guarantee commit order.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/vaultcontext-demo' }}

env:
  IMAGE: ghcr.io/pocketcontext/vaultcontext

jobs:
  # Every branch and pull request: build for the runner's architecture and run the image.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd
            runner: ubuntu-24.04
          - arch: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Frozen container startup
        run: python3 tests/entrypoint.py
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vaultcontext:ci
          build-args: REVISION=${{ github.sha }}
          provenance: false
          # Reuse this architecture's validated build cache during publication.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Show the image
        run: |
          docker image inspect vaultcontext:ci --format 'image={{.Id}} architecture={{.Architecture}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          docker run --rm --entrypoint sh vaultcontext:ci -c 'set -eu; litestream version; pocketcontext --version; cat /app/POCKETCONTEXT_VERSION; find /app /usr/local/bin -type f | sort; test ! -e /app/pb_hooks/.gitkeep'
      - name: Install uv
        run: python3 -m pip install uv==0.12.21
      - name: Install locked client package for populated recovery verification
        run: uv sync --locked
      - name: Runtime maintenance with the built server
        run: |
          container=$(docker create vaultcontext:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/pocketcontext" "$RUNNER_TEMP/pocketcontext-maintenance"
          chmod +x "$RUNNER_TEMP/pocketcontext-maintenance"
          uv run --locked python tests/maintenance.py --binary "$RUNNER_TEMP/pocketcontext-maintenance"
          docker cp "$container:/usr/local/bin/litestream" "$RUNNER_TEMP/vaultcontext-litestream"
          chmod +x "$RUNNER_TEMP/vaultcontext-litestream"
          VAULTCONTEXT_TEST_LITESTREAM="$RUNNER_TEMP/vaultcontext-litestream" uv run --locked python -m unittest discover -s tests -p test_demo_replication_real.py
          VAULTCONTEXT_DEMO_TEST_LITESTREAM="$RUNNER_TEMP/vaultcontext-litestream" uv run --locked python -m unittest discover -s tests -p test_demo_contact_replica.py
          VAULTCONTEXT_TEST_BINARY="$RUNNER_TEMP/pocketcontext-maintenance" VAULTCONTEXT_TEST_LITESTREAM="$RUNNER_TEMP/vaultcontext-litestream" uv run --locked python -m unittest discover -s tests -p test_demo_auxiliary_replication.py
          VAULTCONTEXT_TEST_BINARY="$RUNNER_TEMP/pocketcontext-maintenance" VAULTCONTEXT_TEST_LITESTREAM="$RUNNER_TEMP/vaultcontext-litestream" uv run --locked python -m unittest discover -s tests -p test_demo_once_runtime.py
      - name: Native ONCE bootstrap and exclusive volume
        run: python3 docker/once_smoke.py --image vaultcontext:ci
      - name: Startup errors for missing configuration
        run: uv run --locked python docker/smoke.py config --image vaultcontext:ci
      - name: Smoke test
        run: uv run --locked python docker/smoke.py smoke --image vaultcontext:ci
      - name: Restore drill
        run: uv run --locked python docker/smoke.py restore --image vaultcontext:ci

      - name: Migration database equality gate
        run: python3 tests/test_object_storage_equivalence.py

  # Application validation runs once on every event, including pull requests.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Each architecture is built on its own runner and pushed by digest, under no tag, so that two runs
  # close together cannot mix their halves in one manifest.
  build:
    if: github.event_name != 'pull_request' && ((github.ref == 'refs/heads/main' && vars.VAULTCONTEXT_PUBLISH == 'true') || (github.ref == 'refs/heads/vaultcontext-demo' && vars.VAULTCONTEXT_DEMO_PUBLISH == 'true'))
    needs:
      - check
      - tests
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One imagetools call creates both tags from the digests of this run.
  manifest:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale release: workflow revision is not current main.' >&2
            exit 1
          fi
      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          set -- *
          echo "digests of this run: $*"
          test "$#" -eq 2
          sources=""
          for digest in "$@"; do
            sources="$sources $IMAGE@sha256:$digest"
          done
          # shellcheck disable=SC2086 # one argument per digest
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA::7}" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            $sources
      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # The demo branch publishes only its own tags. It never enters production deployment.
  demo_manifest:
    if: github.ref == 'refs/heads/vaultcontext-demo' && github.event_name != 'pull_request' && vars.VAULTCONTEXT_DEMO_PUBLISH == 'true'
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require current demo revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/vaultcontext-demo" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale demo release: workflow revision is not current vaultcontext-demo.' >&2
            exit 1
          fi
      - name: Create and push the demo manifest
        id: publish
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          set -- *
          test "$#" -eq 2
          sources=()
          for digest in "$@"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo 'Invalid platform image digest.' >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --metadata-file "$RUNNER_TEMP/demo-manifest.json" \
            --tag "$IMAGE:demo" \
            --tag "$IMAGE:demo-sha-$GITHUB_SHA" \
            "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/demo-manifest.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Invalid multi-platform image digest.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Demo image: %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Show the immutable demo image
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE@$PUBLISHED_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-image-metadata
          path: ${{ runner.temp }}/demo-manifest.json
          if-no-files-found: error
          retention-days: 30

  demo_deploy:
    if: github.ref == 'refs/heads/vaultcontext-demo' && github.event_name != 'pull_request' && vars.VAULTCONTEXT_DEMO_DEPLOY_ENABLED == 'true' && vars.VAULTCONTEXT_DEMO_DEPLOY_PAUSED != 'true'
    needs:
      - demo_manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: vaultcontext-demo
    concurrency:
      group: deploy-vaultcontext-demo
      cancel-in-progress: false
    env:
      DEMO_DIGEST: ${{ needs.demo_manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require current demo deployment revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/vaultcontext-demo" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale demo deployment.' >&2
            exit 1
          fi
      - name: Deploy exact demo digest over restricted SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$SERVER_USER" = deploy
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SERVER_IP"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          digest, revision = os.environ['DEMO_DIGEST'], os.environ['GITHUB_SHA']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest) or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Invalid demo release identity')
          Path(os.environ['RUNNER_TEMP'], 'demo-request.json').write_text(json.dumps({
              'image': 'ghcr.io/pocketcontext/vaultcontext@' + digest, 'revision': revision}) + '\n')
          PY
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null 2>&1
          # The dedicated forced-command key reads a bounded release JSON request.
          # No remote command, registry credential, shell script or archive is sent.
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_IP" < "$RUNNER_TEMP/demo-request.json" > "$RUNNER_TEMP/demo-receipt.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = Path(os.environ['RUNNER_TEMP'], 'demo-receipt.json').read_bytes()
          if len(raw) > 4096:
              raise SystemExit('Invalid demo release receipt')
          receipt = json.loads(raw)
          expected = {'ready': True, 'revision': os.environ['GITHUB_SHA'],
                      'image': 'ghcr.io/pocketcontext/vaultcontext@' + os.environ['DEMO_DIGEST']}
          if receipt != expected or receipt.get('ready') is not True:
              raise SystemExit('Demo release receipt differs from requested revision and digest')
          PY
      - name: Attest public demo assets and downloads
        run: |
          python3 - <<'PY'
          import hashlib, json, re, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          origin = 'https://vault-demo.pocketcontext.com'
          def fetch(path, limit=4194304):
              request = Request(origin + path, headers={'User-Agent': 'VaultContext-Demo-Release-Check/1.0'})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200 or not response.geturl().startswith(origin + '/'):
                      raise ValueError('Unexpected public demo response')
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise ValueError('Public artifact exceeds limit')
                  return body
          def verify():
              status = json.loads(fetch('/api/demo/status', 32768))
              day = datetime.now(timezone.utc).date().isoformat()
              if status.get('enabled') is not True or status.get('clientReady') is not True or status.get('generation') != day:
                  raise ValueError('Public demo is not ready for the current UTC generation')
              manifest = status['downloads']
              if manifest.get('origin') != origin or manifest.get('schema') != 1 or manifest.get('package') != 'vaultcontext-client':
                  raise ValueError('Unexpected public download manifest')
              version, release = manifest['version'], manifest['release']
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or not re.fullmatch(re.escape(version) + r'-[0-9a-f]{20}', release):
                  raise ValueError('Invalid public release version')
              names = {'wheel': 'vaultcontext_client-' + version + '-py3-none-any.whl',
                       'skill': 'vaultcontext-skill.tar.gz', 'launcher': 'vaultcontext'}
              if set(manifest['artifacts']) != set(names):
                  raise ValueError('Unexpected public artifact inventory')
              for key, name in names.items():
                  artifact = manifest['artifacts'][key]
                  if artifact['path'] != '/demo/downloads/' + release + '/' + name or not re.fullmatch(r'[0-9a-f]{64}', artifact['sha256']):
                      raise ValueError('Unexpected artifact identity')
                  if type(artifact['size']) is not int or not 0 < artifact['size'] <= 4194304:
                      raise ValueError('Invalid public artifact size')
                  body = fetch(artifact['path'])
                  if len(body) != artifact['size'] or hashlib.sha256(body).hexdigest() != artifact['sha256']:
                      raise ValueError('Public artifact integrity mismatch')
              for name in ('index.html', 'app.js', 'styles.css'):
                  expected = Path('pb_public/demo', name).read_bytes()
                  if hashlib.sha256(fetch('/demo/' + name)).digest() != hashlib.sha256(expected).digest():
                      raise ValueError('Public assets differ from the workflow revision')
          for attempt in range(6):
              try:
                  verify()
                  break
              except Exception:
                  if attempt == 5:
                      raise SystemExit('Public demo release attestation failed') from None
                  time.sleep(5)
          print('Public demo generation, revision assets and download integrity verified')
          PY

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CONTEXT_DEPLOY_PAUSED != 'true' && vars.COLORS_PROFILE != ''
    needs:
      - manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ vars.COLORS_PROFILE }}
    # Serialize rather than cancel: interrupting a deploy midway is worse than making the next one wait.
    concurrency:
      group: deploy-${{ vars.COLORS_PROFILE }}
      cancel-in-progress: false
    steps:
      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale release: workflow revision is not current main.' >&2
            exit 1
          fi
      - name: Deploy via SSH
        env:
          # Only the key is a secret. The address and user are variables, so the logs stay readable.
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # shellcheck disable=SC2046
          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

          # Pinned by ONCE at provisioning time, not scanned here. Fail closed.
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KNOWN_HOSTS is unset; configure the once-pocketcontext-v2 deployment environment" >&2
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

          # The fixed shared dispatcher accepts no remote command or registry credentials.
          # It resolves latest to a digest; the workflow does not attest the live source revision.
          test "$SERVER_USER" = deploy
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" < /dev/null
      - name: Verify public health
        run: |
          # /up executes a database query, so HTTP 200 also checks database availability.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 12 --retry-delay 5 --retry-max-time 180 --retry-all-errors \
            https://vault.pocketcontext.com/up
