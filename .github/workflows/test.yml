name: Vault application validation
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vaultcontext
          persist-credentials: false
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          "$RUNNER_TEMP/uv-bootstrap/bin/pip" install uv==0.12.21
          echo "$RUNNER_TEMP/uv-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Install locked client package
        working-directory: vaultcontext
        run: uv sync --locked
      - name: Use a symlink-free temporary directory on macOS
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - name: Read pinned server revision
        id: server
        shell: bash
        run: |
          revision=$(cat vaultcontext/POCKETCONTEXT_VERSION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pocketcontext/pocketcontext
          ref: ${{ steps.server.outputs.revision }}
          path: pocketcontext
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pocketcontext/go.mod
          cache-dependency-path: pocketcontext/go.sum
      - name: Build pinned server
        working-directory: pocketcontext
        run: CGO_ENABLED=1 go build -tags sqlite_math_functions -o bin/pocketcontext ./cmd/pocketcontext
      - name: Frozen container startup
        run: python3 vaultcontext/tests/maintenance_entrypoint.py
      - name: Crypto, client, packaging and deployment unit checks
        run: |
          uv run --locked --project vaultcontext python -m unittest discover -s vaultcontext/tests -p 'test_*.py'
          uv run --locked --project vaultcontext python vaultcontext/tests/deploy_workflow.py
          uv run --locked --project vaultcontext python vaultcontext/tests/oauth.py
      - name: Isolated application, identity, OAuth, portable skill and deployment checks
        run: |
          for check in maintenance integration archive_migration auth oauth_integration realtime skill cli_forward deploy backup_integration limits; do
            uv run --locked --project vaultcontext python "vaultcontext/tests/$check.py" --binary "$PWD/pocketcontext/bin/pocketcontext"
          done
      - name: Copied standalone launcher and memory session
        run: |
          uv run --locked --project vaultcontext python vaultcontext/tests/skill.py --binary "$PWD/pocketcontext/bin/pocketcontext" --client vaultcontext/skills/vaultcontext/vaultcontext
          uv run --locked --project vaultcontext python vaultcontext/tests/cli_forward.py --binary "$PWD/pocketcontext/bin/pocketcontext" --client vaultcontext/skills/vaultcontext/vaultcontext
      - name: Offline onboarding analytics browser checks
        if: runner.os == 'Linux'
        working-directory: vaultcontext
        run: |
          uv run --with playwright==1.60.0 python -m playwright install --with-deps chromium
          uv run --with playwright==1.60.0 python tests/website_analytics.py
